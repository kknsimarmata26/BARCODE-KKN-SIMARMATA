    <style>
        * { font-family:'Segoe UI',Tahoma,sans-serif; }
        body { background:#f4f6f9; margin:0; }
        .sidebar { position:fixed; top:0; left:0; width:250px; height:100vh; background:linear-gradient(180deg,#7c0e0e,#5b0909); color:white; padding:20px 0; overflow-y:auto; transition:.3s; z-index:1000; }
        .sidebar h4 { padding:0 22px 18px; border-bottom:1px solid rgba(255,255,255,.15); font-weight:bold; font-size:18px; margin-bottom:15px; }
        .sidebar a { display:block; color:rgba(255,255,255,.85); padding:12px 22px; text-decoration:none; font-size:15px; border-left:4px solid transparent; transition:.2s; }
        .sidebar a:hover,.sidebar a.active { background:rgba(255,255,255,.1); color:#ffd54f; border-left-color:#ffd54f; }
        .sidebar a i { margin-right:10px; }
        .sidebar hr { border-color:rgba(255,255,255,.15); margin:12px 22px; }
        .main { margin-left:250px; padding:30px; transition:.3s; }
        .menu-btn { display:none; background:#7c0e0e; color:white; border:none; padding:8px 14px; border-radius:8px; font-size:20px; }
        @media (max-width:768px){ .sidebar{transform:translateX(-100%);} .sidebar.show{transform:translateX(0);} .main{margin-left:0;} .menu-btn{display:inline-block;} }
        .btn-primary { background:#7c0e0e; border-color:#7c0e0e; }
        .btn-primary:hover { background:#5b0909; }
        .galeri-card { border-radius:12px; overflow:hidden; box-shadow:0 4px 12px rgba(0,0,0,.1); transition:.3s; }
        .galeri-card:hover { transform:translateY(-5px); box-shadow:0 8px 20px rgba(0,0,0,.15); }
        .galeri-card img { width:100%; height:180px; object-fit:cover; }
    </style>
</head>
