<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin — Desa Simarmata</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f6f9; margin: 0; }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0; left: 0;
            width: 250px;
            height: 100vh;
            background: linear-gradient(180deg, #7c0e0e, #5b0909);
            color: white;
            padding: 20px 0;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        .sidebar h4 {
            padding: 0 22px 18px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .sidebar a {
            display: block;
            color: rgba(255,255,255,0.85);
            padding: 12px 22px;
            text-decoration: none;
            font-size: 15px;
            border-left: 4px solid transparent;
            transition: 0.2s;
        }
        .sidebar a:hover, .sidebar a.active {
            background: rgba(255,255,255,0.1);
            color: #ffd54f;
            border-left-color: #ffd54f;
        }
        .sidebar a i { margin-right: 10px; }
        .sidebar hr { border-color: rgba(255,255,255,0.15); margin: 12px 22px; }

        /* Main */
        .main {
            margin-left: 250px;
            padding: 30px;
            transition: margin 0.3s;
        }
        .topbar {
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        /* Stat Cards */
        .stat-card {
            border-radius: 15px;
            padding: 22px;
            color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.18);
        }
        .stat-card h2 {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0;
            line-height: 1;
        }
        .stat-card p { margin: 8px 0 0; opacity: 0.9; font-size: 14px; }
        .stat-card .icon {
            position: absolute;
            right: 15px;
            bottom: 10px;
            font-size: 4rem;
            opacity: 0.18;
        }
        .bg-red    { background: linear-gradient(135deg, #7c0e0e, #a11414); }
        .bg-blue   { background: linear-gradient(135deg, #1565c0, #42a5f5); }
        .bg-green  { background: linear-gradient(135deg, #2e7d32, #66bb6a); }
        .bg-orange { background: linear-gradient(135deg, #ef6c00, #ffa726); }

        /* Mobile */
        .menu-btn {
            display: none;
            background: #7c0e0e;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 20px;
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.show { transform: translateX(0); }
            .main { margin-left: 0; }
            .menu-btn { display: inline-block; }
        }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
    <h4><i class="bi bi-shield-lock-fill"></i> Admin Panel</h4>
    <a href="dashboard.html" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="berita.html"><i class="bi bi-newspaper"></i> Berita</a>
    <a href="galeri.html"><i class="bi bi-images"></i> Galeri</a>
    <a href="wisata.html"><i class="bi bi-compass-fill"></i> Wisata</a>
    <a href="umkm.html"><i class="bi bi-shop"></i> UMKM</a>
    <a href="homestay.html"><i class="bi bi-house-door-fill"></i> Homestay</a>
    <a href="pesan.html"><i class="bi bi-envelope-fill"></i> Pesan</a>
    <hr>
    <a href="../index.html"><i class="bi bi-globe"></i> Lihat Website</a>
    <a href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<!-- MAIN -->
<div class="main">
    <div class="topbar">
        <div class="d-flex align-items-center gap-2">
            <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('show')">
                <i class="bi bi-list"></i>
            </button>
            <h4 class="mb-0"><i class="bi bi-speedometer2"></i> Dashboard</h4>
        </div>
        <div>
            <span class="text-muted small d-none d-md-inline">Login sebagai:</span>
            <strong id="userEmail" class="ms-1">...</strong>
        </div>
    </div>

    <div class="alert alert-success">
        👋 Selamat datang di panel admin <strong>Desa Simarmata</strong>!
    </div>

    <div class="row g-4">
        <div class="col-md-6 col-lg-3">
            <div class="stat-card bg-red">
                <i class="bi bi-newspaper icon"></i>
                <h2 id="statBerita">0</h2>
                <p>Total Berita</p>
            </div>
        </div>
        <div class="col-md-6 col-lg-3">
            <div class="stat-card bg-blue">
                <i class="bi bi-images icon"></i>
                <h2 id="statGaleri">0</h2>
                <p>Foto Galeri</p>
            </div>
        </div>
        <div class="col-md-6 col-lg-3">
            <div class="stat-card bg-green">
                <i class="bi bi-shop icon"></i>
                <h2 id="statUmkm">0</h2>
                <p>UMKM</p>
            </div>
        </div>
        <div class="col-md-6 col-lg-3">
            <div class="stat-card bg-orange">
                <i class="bi bi-envelope icon"></i>
                <h2 id="statPesan">0</h2>
                <p>Pesan Baru</p>
            </div>
        </div>
    </div>
</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script>
(async () => {
    const session = await checkAuth();      // redirect kalau belum login
    if (!session) return;

    document.getElementById('userEmail').textContent = session.user.email;

    // Hitung statistik
    const queries = [
        { table: 'berita',        el: 'statBerita', filter: null },
        { table: 'galeri',        el: 'statGaleri', filter: null },
        { table: 'umkm',          el: 'statUmkm',   filter: null },
        { table: 'pesan_kontak',  el: 'statPesan',  filter: { col: 'is_read', val: false } }
    ];

    for (const q of queries) {
        let query = supabaseClient.from(q.table).select('*', { count: 'exact', head: true });
        if (q.filter) query = query.eq(q.filter.col, q.filter.val);
        const { count } = await query;
        document.getElementById(q.el).textContent = count || 0;
    }
})();
</script>

</body>
</html>
