<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Berita — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f6f9; margin: 0; }
        .sidebar {
            position: fixed; top:0; left:0; width:250px; height:100vh;
            background:linear-gradient(180deg,#7c0e0e,#5b0909);
            color:white; padding:20px 0; overflow-y:auto;
            transition:transform .3s; z-index:1000;
        }
        .sidebar h4 { padding:0 22px 18px; border-bottom:1px solid rgba(255,255,255,.15); font-weight:bold; font-size:18px; margin-bottom:15px; }
        .sidebar a { display:block; color:rgba(255,255,255,.85); padding:12px 22px; text-decoration:none; font-size:15px; border-left:4px solid transparent; transition:.2s; }
        .sidebar a:hover,.sidebar a.active { background:rgba(255,255,255,.1); color:#ffd54f; border-left-color:#ffd54f; }
        .sidebar a i { margin-right:10px; }
        .sidebar hr { border-color:rgba(255,255,255,.15); margin:12px 22px; }
        .main { margin-left:250px; padding:30px; transition:.3s; }
        .menu-btn { display:none; background:#7c0e0e; color:white; border:none; padding:8px 14px; border-radius:8px; font-size:20px; }
        @media (max-width:768px){ .sidebar{transform:translateX(-100%);} .sidebar.show{transform:translateX(0);} .main{margin-left:0;} .menu-btn{display:inline-block;} }
        .btn-primary { background:#7c0e0e; border-color:#7c0e0e; }
        .btn-primary:hover { background:#5b0909; border-color:#5b0909; }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar">
    <h4><i class="bi bi-shield-lock-fill"></i> Admin Panel</h4>
    <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="berita.html" class="active"><i class="bi bi-newspaper"></i> Berita</a>
    <a href="galeri.html"><i class="bi bi-images"></i> Galeri</a>
    <a href="wisata.html"><i class="bi bi-compass-fill"></i> Wisata</a>
    <a href="umkm.html"><i class="bi bi-shop"></i> UMKM</a>
    <a href="homestay.html"><i class="bi bi-house-door-fill"></i> Homestay</a>
    <a href="pesan.html"><i class="bi bi-envelope-fill"></i> Pesan</a>
    <hr>
    <a href="../index.html" target="_blank"><i class="bi bi-globe"></i> Lihat Website</a>
    <a href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<div class="main">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center gap-2">
            <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="bi bi-list"></i></button>
            <h2 class="mb-0"><i class="bi bi-newspaper"></i> Kelola Berita</h2>
        </div>
        <button class="btn btn-primary" onclick="openForm()"><i class="bi bi-plus-circle"></i> Tambah</button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Gambar</th><th>Judul</th><th>Kategori</th><th>Status</th><th>Tanggal</th><th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable">
                        <tr><td colspan="6" class="text-center">Memuat...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal Form -->
<div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Tambah Berita</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="dataForm">
                <div class="modal-body">
                    <input type="hidden" id="dataId">
                    <input type="hidden" id="existingImg">
                    <div class="mb-3">
                        <label class="form-label">Judul *</label>
                        <input type="text" class="form-control" id="judul" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Kategori</label>
                        <input type="text" class="form-control" id="kategori" placeholder="Wisata / Budaya / Umum">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Konten *</label>
                        <textarea class="form-control" id="konten" rows="6" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Gambar</label>
                        <input type="file" class="form-control" id="gambar" accept="image/*">
                        <small class="text-muted">Kosongkan jika tidak ingin ganti</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="status">
                            <option value="draft">Draft</option>
                            <option value="published">Published</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Simpan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script>
const TABLE = 'berita';
const FOLDER = 'berita';
let formModal;

document.addEventListener('DOMContentLoaded', async () => {
    const session = await checkAuth();
    if (!session) return;
    formModal = new bootstrap.Modal(document.getElementById('formModal'));
    loadData();
});

async function loadData() {
    const tbody = document.getElementById('dataTable');
    const { data, error } = await supabaseClient
        .from(TABLE).select('*').order('created_at', { ascending: false });

    if (error) { tbody.innerHTML = `<tr><td colspan="6" class="text-danger">Error: ${error.message}</td></tr>`; return; }
    if (!data.length) { tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">Belum ada data</td></tr>`; return; }

    tbody.innerHTML = data.map(b => `
        <tr>
            <td>${b.gambar_url ? `<img src="${b.gambar_url}" style="width:70px;height:50px;object-fit:cover;border-radius:8px;">` : '-'}</td>
            <td><strong>${b.judul}</strong></td>
            <td>${b.kategori || '-'}</td>
            <td><span class="badge bg-${b.status === 'published' ? 'success' : 'secondary'}">${b.status}</span></td>
            <td>${formatTanggal(b.created_at)}</td>
            <td>
                <button class="btn btn-sm btn-warning" onclick='editData(${JSON.stringify(b).replace(/'/g, "&apos;")})'><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-danger" onclick="hapusData('${b.id}')"><i class="bi bi-trash"></i></button>
            </td>
        </tr>
    `).join('');
}

function openForm() {
    document.getElementById('dataForm').reset();
    document.getElementById('dataId').value = '';
    document.getElementById('existingImg').value = '';
    document.getElementById('modalTitle').textContent = 'Tambah Berita';
    formModal.show();
}

function editData(b) {
    document.getElementById('dataId').value = b.id;
    document.getElementById('judul').value = b.judul;
    document.getElementById('kategori').value = b.kategori || '';
    document.getElementById('konten').value = b.konten || '';
    document.getElementById('status').value = b.status || 'draft';
    document.getElementById('existingImg').value = b.gambar_url || '';
    document.getElementById('modalTitle').textContent = 'Edit Berita';
    formModal.show();
}

document.getElementById('dataForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Menyimpan...';

    try {
        const id = document.getElementById('dataId').value;
        const fileInput = document.getElementById('gambar');
        let gambar_url = document.getElementById('existingImg').value;

        if (fileInput.files.length > 0) {
            gambar_url = await uploadImage(fileInput.files[0], FOLDER);
        }

        const payload = {
            judul: document.getElementById('judul').value,
            kategori: document.getElementById('kategori').value,
            konten: document.getElementById('konten').value,
            status: document.getElementById('status').value,
            gambar_url
        };

        const result = id
            ? await supabaseClient.from(TABLE).update(payload).eq('id', id)
            : await supabaseClient.from(TABLE).insert([payload]);

        if (result.error) throw result.error;
        formModal.hide();
        loadData();
    } catch (err) {
        alert('Gagal: ' + err.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = 'Simpan';
    }
});

async function hapusData(id) {
    if (!confirm('Yakin hapus data ini?')) return;
    const { error } = await supabaseClient.from(TABLE).delete().eq('id', id);
    if (error) alert('Gagal: ' + error.message);
    else loadData();
}
</script>
</body>
</html>
