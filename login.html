<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin — Desa Simarmata</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #7c0e0e 0%, #a11414 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            padding: 45px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            animation: fadeUp 0.6s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-card .logo { text-align: center; margin-bottom: 15px; }
        .login-card .logo img { height: 75px; }
        .login-card h2 {
            color: #7c0e0e;
            font-weight: bold;
            text-align: center;
            margin-bottom: 5px;
        }
        .login-card p.subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-label { font-weight: 600; color: #444; font-size: 14px; }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1.5px solid #e0e0e0;
            transition: 0.2s;
        }
        .form-control:focus {
            border-color: #7c0e0e;
            box-shadow: 0 0 0 0.2rem rgba(124, 14, 14, 0.15);
        }
        .input-group-text {
            background: #f8f9fa;
            border-radius: 10px 0 0 10px;
            border: 1.5px solid #e0e0e0;
            border-right: none;
        }
        .input-group .form-control { border-radius: 0 10px 10px 0; }
        .btn-login {
            background: linear-gradient(90deg, #7c0e0e, #a11414);
            color: white;
            border: none;
            padding: 13px;
            font-weight: bold;
            border-radius: 10px;
            width: 100%;
            transition: 0.3s;
            letter-spacing: 0.5px;
        }
        .btn-login:hover:not(:disabled) {
            background: linear-gradient(90deg, #5b0909, #7c0e0e);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(124, 14, 14, 0.35);
        }
        .btn-login:disabled { opacity: 0.7; }
        .back-link {
            color: #7c0e0e;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }
        .back-link:hover { color: #5b0909; text-decoration: underline; }
        .password-wrapper { position: relative; }
        .toggle-pw {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
            z-index: 5;
        }
        .toggle-pw:hover { color: #7c0e0e; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo">
        <img src="https://raw.githubusercontent.com/kknsimarmata26/BARCODE-KKN-SIMARMATA/9d01db11173e316b6cd4543a631806958c03ea39/logo%203%20web.png"
             alt="Logo Desa Simarmata">
    </div>

    <h2>Admin Login</h2>
    <p class="subtitle">Desa Simarmata — Kec. Simanindo</p>

    <div id="alertBox"></div>

    <form id="loginForm" autocomplete="on">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope-fill text-muted"></i></span>
                <input type="email" class="form-control" id="email"
                       placeholder="admin@simarmata.com" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">Password</label>
            <div class="input-group password-wrapper">
                <span class="input-group-text"><i class="bi bi-lock-fill text-muted"></i></span>
                <input type="password" class="form-control" id="password"
                       placeholder="••••••••" required>
                <i class="bi bi-eye-fill toggle-pw" id="togglePw"></i>
            </div>
        </div>

        <button type="submit" class="btn btn-login" id="submitBtn">
            <i class="bi bi-box-arrow-in-right"></i> Masuk
        </button>
    </form>

    <div class="text-center mt-4">
        <a href="../index.html" class="back-link">
            <i class="bi bi-arrow-left"></i> Kembali ke Website
        </a>
    </div>
</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script>
// ==========================================
// Kalau sudah login, langsung ke dashboard
// ==========================================
(async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) window.location.href = 'dashboard.html';
})();

// ==========================================
// Toggle show/hide password
// ==========================================
document.getElementById('togglePw').addEventListener('click', function () {
    const pw = document.getElementById('password');
    const icon = this;
    if (pw.type === 'password') {
        pw.type = 'text';
        icon.classList.remove('bi-eye-fill');
        icon.classList.add('bi-eye-slash-fill');
    } else {
        pw.type = 'password';
        icon.classList.remove('bi-eye-slash-fill');
        icon.classList.add('bi-eye-fill');
    }
});

// ==========================================
// Handle submit login
// ==========================================
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const btn      = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Memproses...';
    alertBox.innerHTML = '';

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
    });

    if (error) {
        alertBox.innerHTML = `
            <div class="alert alert-danger py-2" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                ${error.message === 'Invalid login credentials'
                    ? 'Email atau password salah!'
                    : error.message}
            </div>`;
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Masuk';
        return;
    }

    // Sukses → redirect ke dashboard
    alertBox.innerHTML = `
        <div class="alert alert-success py-2">
            <i class="bi bi-check-circle-fill"></i> Login berhasil! Mengalihkan...
        </div>`;

    setTimeout(() => {
        window.location.href = 'dashboard.html';
    }, 700);
});
</script>

</body>
</html>
